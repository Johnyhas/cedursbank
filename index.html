<!DOCTYPE html>
<html>
  <head>
    <title>Redirecting...</title>
    <meta charset="UTF-8" />
    <script>
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;

      if (/android/i.test(userAgent)) {
        window.location.href = "https://play.google.com/store/apps/details?id=com.cedrus.bank&pcampaignid=web_share";
      } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        window.location.href = "https://apps.apple.com/us/developer/cedrus-bank-sal/id1323065451";
      } else {
        window.location.href = "https://www.cedrusbank.com/";
      }
    </script>
  </head>
  <body>
    <p>Redirecting to the app...</p>
  </body>
</html>
